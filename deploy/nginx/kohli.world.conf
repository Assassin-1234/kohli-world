# kohli.world (KOHLI●WORLD). Static site. Headers live in snippets/kohliworld-security.conf.

# Umami analytics: the only write the site accepts is a POST to /u/api/send (rate limited).
map "$request_method:$uri" $kw_method_ok {
    default 0;
    "~^(GET|HEAD):" 1;
    "POST:/u/api/send" 1;
}
limit_req_zone $binary_remote_addr zone=kw_collect:1m rate=5r/s;

# http -> https, everything to the apex
server {
    listen 80;
    listen [::]:80;
    server_name kohli.world www.kohli.world;
    server_tokens off;
    return 301 https://kohli.world$request_uri;
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.kohli.world;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/kohli.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kohli.world/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    return 301 https://kohli.world$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kohli.world;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/kohli.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kohli.world/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/kohli.world;
    index index.html;
    charset utf-8;
    charset_types text/plain text/css application/javascript text/xml application/xml;

    access_log /var/log/nginx/kohliworld.access.log;
    error_log  /var/log/nginx/kohliworld.error.log;

    # real visitor IPs if ever proxied through Cloudflare
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json application/xml image/svg+xml text/plain;

    # a static site reads; the one exception is the analytics beacon
    if ($kw_method_ok = 0) { return 405; }

    # never serve dotfiles (except .well-known) or source-only folders
    location ~ /\.(?!well-known/) { return 404; }
    location ^~ /tools/ { return 404; }

    # analytics (Umami on 127.0.0.1:3093), same-origin so the CSP stays 'self'
    location = /u/k.js {
        include snippets/kohliworld-security.conf;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=3600" always;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:3093/script.js;
    }
    location = /u/api/send {
        limit_req zone=kw_collect burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        include snippets/kohliworld-security.conf;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://127.0.0.1:3093/api/send;
    }
    location ^~ /u/ { return 404; }

    location = / {
        include snippets/kohliworld-security.conf;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # the vault: says nothing on the page, a little more in the response
    location ^~ /vault/ {
        include snippets/kohliworld-security.conf;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Shield "engaged; weak-point=surface" always;
        add_header Link "</.well-known/security.txt>; rel=\"help\"" always;
        try_files $uri $uri/index.html =404;
    }

    location = /.well-known/security.txt {
        include snippets/kohliworld-security.conf;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=86400" always;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~* \.(?:css|js)$ {
        include snippets/kohliworld-security.conf;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.woff2$ {
        include snippets/kohliworld-security.conf;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # images may be shown by link previews elsewhere
    location ~* \.(?:jpg|jpeg|png|svg|ico)$ {
        include snippets/kohliworld-security.conf;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        types { application/manifest+json webmanifest; }
        include snippets/kohliworld-security.conf;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location / {
        include snippets/kohliworld-security.conf;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri $uri/ =404;
    }
}
