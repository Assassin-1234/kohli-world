# stats.kohli.world: Umami dashboard (127.0.0.1:3093).
server {
    listen 80;
    listen [::]:80;
    server_name stats.kohli.world;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://stats.kohli.world$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stats.kohli.world;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/stats.kohli.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.kohli.world/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/kohliworld-stats.access.log;
    error_log  /var/log/nginx/kohliworld-stats.error.log;

    allow 203.0.113.10;  # your IP. Optional: remove allow/deny once the default Umami login is changed.
    deny all;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3093;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
